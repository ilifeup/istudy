<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- iStudy（dev.60）：繁體中文 Office 常用字型 → 映像內的 Noto CJK 繁體中文（TC）字型。
     沒有這個設定時，這些字型會落到 DejaVu Sans 與 Noto CJK 的簡體字形（SC）。
     明體 → Noto Serif CJK TC；正黑體 → Noto Sans CJK TC；標楷體沒有開源的同款字型，暫用 Noto Serif CJK TC。 -->
<fontconfig>
  <match target="pattern"><test name="family" qual="any"><string>新細明體</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>PMingLiU</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>細明體</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>MingLiU</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>PMingLiU-ExtB</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>MingLiU-ExtB</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>細明體_HKSCS</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>MingLiU_HKSCS</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>標楷體</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>DFKai-SB</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>微軟正黑體</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Microsoft JhengHei</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Microsoft JhengHei UI</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>Microsoft JhengHei Light</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
</fontconfig>
