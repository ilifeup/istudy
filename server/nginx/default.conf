# iStudy Nginx（第 12、16 章）
#  :80 → 主機 :4080（LAN）：一般 API、串流、更新檔、心跳；/api/admin/* 一律 404
#  :81 → 主機 127.0.0.1:4081（只限本機）：Server App 用，一般 API＋管理 API

map $http_origin $istudy_cors {
    default        "";
    "app://istudy" $http_origin;
}

server_tokens off;
client_max_body_size 16m;

server {
    listen 80 default_server;
    server_name _;

    location ^~ /api/admin/ { return 404; }
    location /api/ {
        include /etc/nginx/istudy_fastcgi.conf;
        fastcgi_param ISTUDY_LOCAL_ADMIN "0";
    }
    # Client 更新檔：/updates/win7/、/updates/win10/、/updates/win11/、/updates/ubuntu/
    location /updates/ {
        alias /srv/istudy/updates/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }
    include /etc/nginx/istudy_protected.conf;
    location / { return 404; }
}

server {
    listen 81;
    server_name _;

    location /api/ {
        include /etc/nginx/istudy_fastcgi.conf;
        fastcgi_param ISTUDY_LOCAL_ADMIN "1";
    }
    location /updates/ {
        alias /srv/istudy/updates/;
        autoindex off;
    }
    include /etc/nginx/istudy_protected.conf;
    location / { return 404; }
}
