# 只能由 PHP 回傳 X-Accel-Redirect 進入（internal）；外部直接請求一律 404。
# Nginx 原生處理分段請求（拖曳進度條）。CORS 標頭在這裡加（PHP 送 X-Accel 時不加，避免重複）。
location /_protected/playback/ {
    internal;
    alias /Media/playback/;
    sendfile on;
    tcp_nopush on;
    add_header Access-Control-Allow-Origin $istudy_cors always;
    add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location /_protected/doc/ {
    internal;
    alias /Media/doc-cache/;
    sendfile on;
    add_header Access-Control-Allow-Origin $istudy_cors always;
    add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location /_protected/original/ {
    # 直接播放的 MP4、原生 PDF、圖片
    internal;
    alias /Media/;   # dev.59：教材根目錄是 /Media；只接受 PHP 驗證後的內部轉址（系統資料夾由 PHP 擋下）
    sendfile on;
    tcp_nopush on;
    add_header Access-Control-Allow-Origin $istudy_cors always;
    add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
